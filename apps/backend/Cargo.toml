[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "any", "postgres", "uuid", "chrono"] }
anyhow = "1.0.102"
dotenvy = "0.15"
argon2 = "0.5.3"
jwt = "0.16.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
hmac = "0.12"
digest = "0.10"
envy = "0.4"
ts-rs = { version = "12.0", features = ["uuid-impl","serde-json-impl", "chrono-impl"] }
tracing = "0.1"
tracing-subscriber = "0.3"
